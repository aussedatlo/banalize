name: Pull Request CI

on:
  pull_request:

# Cancel superseded runs for the same PR.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which jobs this PR needs from the files it touches. Skipped jobs
  # count as passing for the CI gate below.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      core: ${{ steps.filter.outputs.core }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - ".github/workflows/pull-request.yml"
            js:
              - *workflow
              - "apps/ui/**"
              - "apps/e2e/**"
              - "packages/**"
              - "**/*.md"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "prettier.config.js"
              - ".prettierignore"
            core: &core
              - *workflow
              - "apps/core/**"
              - "Cargo.toml"
              - "Cargo.lock"
            e2e:
              - *core
              - "apps/ui/**"
              - "apps/e2e/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "docker-compose.e2e*.yml"
              - ".dockerignore"

  # Lint, formatting and typecheck share one job so they share one install.
  # Each check runs even if an earlier one fails, so all problems show at once.
  checks:
    name: Lint, format & typecheck
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install

      - name: Run linters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Typecheck all packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -r typecheck

  core-test:
    name: Core test
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core

      - name: Run core e2e tests
        working-directory: apps/core
        run: cargo test --test e2e

  e2e:
    name: E2E test
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Cache the downloaded browser per Playwright version; the system deps
      # are apt packages outside the cache, so they're installed either way.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter=@banalize/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@banalize/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@banalize/e2e exec playwright install-deps chromium

      # Pre-build the Docker images so the run stays within Playwright's
      # webServer start timeout. Layers are cached in the GitHub Actions cache
      # (one scope per image so they don't evict each other); buildx stays the
      # active builder, so start-servers.sh's `up --build` hits the same cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e2e stack images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.e2e.yml
          load: true
          set: |
            core.cache-from=type=gha,scope=e2e-core
            core.cache-to=type=gha,scope=e2e-core,mode=max
            ui.cache-from=type=gha,scope=e2e-ui
            ui.cache-to=type=gha,scope=e2e-ui,mode=max

      - name: Run Playwright e2e tests
        run: pnpm e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  # Single required check: goes red as soon as any job above fails, so branch
  # protection only has to track this one job.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, checks, core-test, e2e]
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
