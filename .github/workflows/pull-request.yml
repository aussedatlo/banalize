name: Pull Request CI

on:
  pull_request:

# Cancel superseded runs for the same PR.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, formatting and typecheck share one job so they share one install.
  # Each check runs even if an earlier one fails, so all problems show at once.
  checks:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install

      - name: Run linters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Typecheck all packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -r typecheck

  core-test:
    name: Core test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core

      - name: Run core e2e tests
        working-directory: apps/core
        run: cargo test --test e2e

  e2e:
    name: E2E test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browser
        run: pnpm --filter=@banalize/e2e exec playwright install --with-deps chromium

      # Pre-build the Docker images so the run stays within Playwright's
      # webServer start timeout. Layers are cached in the GitHub Actions cache
      # (one scope per image so they don't evict each other); buildx stays the
      # active builder, so start-servers.sh's `up --build` hits the same cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e2e stack images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.e2e.yml
          load: true
          set: |
            core.cache-from=type=gha,scope=e2e-core
            core.cache-to=type=gha,scope=e2e-core,mode=max
            ui.cache-from=type=gha,scope=e2e-ui
            ui.cache-to=type=gha,scope=e2e-ui,mode=max

      - name: Run Playwright e2e tests
        run: pnpm e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  # Single required check: goes red as soon as any job above fails, so branch
  # protection only has to track this one job.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [checks, core-test, e2e]
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
